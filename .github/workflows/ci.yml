name: Dnipro CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  ANCHOR_VERSION: 0.31.1
  SOLANA_VERSION: 2.2.20
  NODE_VERSION: 20

jobs:
  anchor-build:
    name: Anchor Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor \
            anchor-cli --tag v${{ env.ANCHOR_VERSION }} --locked

      - name: Cargo format check
        run: cargo fmt --all --check

      - name: Anchor build
        run: anchor build

  typescript:
    name: SDK, CLI & Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: yarn install --non-interactive

      - name: Build SDK
        run: yarn build:sdk

      - name: Build CLI
        run: yarn build:cli

      - name: Type-check web
        run: cd web && npx tsc --noEmit

      - name: Build web
        run: yarn build:web
        env:
          NEXT_PUBLIC_RPC_URL: https://api.devnet.solana.com
          NEXT_PUBLIC_SOLANA_NETWORK: devnet
          NEXT_PUBLIC_DEMO_MODE: 'true'

  reference-tests:
    name: Local Reference Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: yarn install --non-interactive

      - name: Set up local wallet
        run: solana-keygen new --no-bip39-passphrase -o ~/.config/solana/id.json

      - name: Start local validator
        run: |
          solana-test-validator --reset > /tmp/dnipro-validator.log 2>&1 &
          sleep 5

      - name: Run TypeScript reference tests
        run: yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts
        env:
          ANCHOR_PROVIDER_URL: http://localhost:8899
          ANCHOR_WALLET: ~/.config/solana/id.json
